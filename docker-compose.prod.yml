# Images are selected by IMAGE_TAG (the commit SHA, set by the deploy workflow);
# it falls back to :latest only for ad-hoc manual runs on the server.

# `inspect ping` against this worker's own node name proves the worker is
# connected to the broker and responding, not just that the process is alive.
# Loading the Django/Celery app takes a few seconds, hence the generous timing.
x-celery-healthcheck: &celery-healthcheck
  test: ["CMD-SHELL", "/opt/conda/envs/osdag_env/bin/celery --workdir=/app -A config inspect ping -t 10 -d celery@$$HOSTNAME"]
  interval: 30s
  timeout: 30s
  retries: 3
  start_period: 90s

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-osdagdeveloper}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-osdagdeveloper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-osdagdeveloper} -d ${DATABASE_NAME:-osdagdeveloper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/sogalabhi/osdag-web/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/backend
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      DATABASE_NAME: ${DATABASE_NAME:-osdagdeveloper}
      DATABASE_USER: ${DATABASE_USER:-osdagdeveloper}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      USE_REDIS_CACHE: ${USE_REDIS_CACHE:-true}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - osifiles_volume:/app/osifiles
      - file_storage_volume:/app/file_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations are NOT run here: the deploy workflow runs `migrate` once
    # (docker compose run --rm backend ...) before containers are replaced.
    command: >
      bash -c "/opt/conda/envs/osdag_env/bin/python manage.py collectstatic --noinput &&
      exec /opt/conda/envs/osdag_env/bin/gunicorn config.asgi:application 
      --bind 0.0.0.0:8000 
      --workers 4 
      --worker-class uvicorn.workers.UvicornWorker 
      --timeout 60"
    expose:
      - "8000"
    # /api/health/ checks DB + Redis and returns 503 if either is down. Uses the
    # conda python (no curl in the image); urlopen raises on non-2xx.
    # start_period covers collectstatic at boot.
    healthcheck:
      test: ["CMD", "/opt/conda/envs/osdag_env/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  celery_worker_calc:
    image: ghcr.io/sogalabhi/osdag-web/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/backend
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_NAME: ${DATABASE_NAME:-osdagdeveloper}
      DATABASE_USER: ${DATABASE_USER:-osdagdeveloper}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      USE_REDIS_CACHE: ${USE_REDIS_CACHE:-true}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    # The design task also builds the 3D model, so this worker writes to file_storage/cad_models
    # and, as pythonocc-core can leak memory, recycles its child processes.
    volumes:
      - file_storage_volume:/app/file_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "exec /opt/conda/envs/osdag_env/bin/celery --workdir=/app -A config worker -Q calculations --loglevel=info --concurrency=18 --max-tasks-per-child=10"
    healthcheck: *celery-healthcheck

  celery_worker_reports:
    image: ghcr.io/sogalabhi/osdag-web/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/backend
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_NAME: ${DATABASE_NAME:-osdagdeveloper}
      DATABASE_USER: ${DATABASE_USER:-osdagdeveloper}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      USE_REDIS_CACHE: ${USE_REDIS_CACHE:-true}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - media_volume:/app/media
      - osifiles_volume:/app/osifiles
      - file_storage_volume:/app/file_storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "exec /opt/conda/envs/osdag_env/bin/celery --workdir=/app -A config worker -Q reports --loglevel=info --concurrency=4"
    healthcheck: *celery-healthcheck

  celery_beat:
    image: ghcr.io/sogalabhi/osdag-web/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/backend
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_NAME: ${DATABASE_NAME:-osdagdeveloper}
      DATABASE_USER: ${DATABASE_USER:-osdagdeveloper}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "exec /opt/conda/envs/osdag_env/bin/celery -A config beat --loglevel=info"
    # beat has no remote-control channel to ping, so look for its process. The
    # needle is built from two pieces so this probe's own cmdline can't match it.
    healthcheck:
      test: ["CMD", "/opt/conda/envs/osdag_env/bin/python", "-c", "import os,sys; n=b'be'+b'at'; sys.exit(0 if any(n in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit() and p!=str(os.getpid())) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - media_volume:/app/media
      - osifiles_volume:/app/osifiles
      - file_storage_volume:/app/file_storage

  frontend:
    image: ghcr.io/sogalabhi/osdag-web/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Public traffic arrives only via the Cloudflare tunnel; port 80 is reachable from the host alone.
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      backend:
        condition: service_healthy
    # Static index.html is enough to prove nginx is serving; the deploy smoke
    # test separately checks the /api/ proxy path. 127.0.0.1 (not localhost)
    # because nginx only listens on IPv4 and alpine may resolve localhost to ::1.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:80
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  osifiles_volume:
  file_storage_volume: