# Ruff configuration for the Django backend.
#
# Scope: only backend/ is linted for now. osdag_core/ is the engineering
# library and is excluded until it is cleaned up separately.
# Run with:  ruff check backend
#
# The rule set is deliberately small so the check can be adopted without a
# large cleanup. Add rules gradually.

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["backend/**/*.py"]
extend-exclude = [
    "**/migrations/**",   # generated by makemigrations
    "osdag_core/**",      # engineering library, linted separately later
    "**/node_modules/**",
    "**/.venv/**",
    "**/generated/**",
    "**/vendor/**",
    "backend/file_storage/**",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting
select = ["E", "W", "F", "I"]
# Long lines are reported by the formatter and are not worth blocking on yet
ignore = ["E501"]
