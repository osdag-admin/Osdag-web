name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [25april]

# A newer push to the same branch/PR supersedes the older run. Runs on the
# deploy branch are never cancelled so every merge still gets a CI result and
# a CD run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/25april' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-lint:
    # Fails on rules that catch real bugs (same set as the pre-commit hook).
    # The full rule set is report-only until the old findings are cleaned up;
    # then the second step drops --exit-zero and the first step goes away.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.2

      - name: Ruff (bugs, blocking)
        run: ruff check backend --select E9,F63,F7,F82

      - name: Ruff (full rule set, report only)
        run: ruff check backend --exit-zero --statistics

  backend-qa:
    runs-on: ubuntu-latest
    # docker compose refuses to start without these (locally they come from .env);
    # CI-only dummy values.
    # DATABASE_PASSWORD must match what the test step connects with.
    env:
      DATABASE_PASSWORD: password
      SECRET_KEY: ci-dummy-secret-key
      INFLUXDB_TOKEN: ci-dummy-influxdb-token
      INFLUXDB_ADMIN_PASSWORD: ci-dummy-influxdb-password
      GRAFANA_ADMIN_PASSWORD: ci-dummy-grafana-password
    steps:
      - uses: actions/checkout@v4

      # PySide6 (imported by osdag_core) needs these GL libraries; the Docker image gets them the same way.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglu1-mesa libxkbcommon0

      - name: Start DB and Redis
        run: docker compose up -d db redis

      - name: Wait for Database
        run: |
          python -c "
          import socket, time
          for i in range(15):
              try:
                  with socket.create_connection(('localhost', 5433), timeout=1):
                      print('Database is ready!')
                      break
              except socket.error:
                  print('Waiting for database...')
                  time.sleep(1)
          "

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: osdag_env
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          miniforge-version: "latest"
          use-mamba: true
          cache-downloads: true
          cache-downloads-key: ${{ runner.os }}-conda-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          mamba install pythonocc-core cairo pip -y
          python -m pip install -r requirements.txt pytest pytest-django

      - name: Check generated frontend keys are up to date
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/gen_core_keys.py
          git diff --exit-code frontend/src/constants/generated/

      # Report-only until the unpinned backend packages are locked; then drop continue-on-error.
      - name: Audit Python dependencies
        shell: bash -l {0}
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off

      - name: Run tests
        shell: bash -l {0}
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5433
          DATABASE_NAME: postgres_Intg_osdag
          DATABASE_USER: osdagdeveloper
          DATABASE_PASSWORD: password
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          xvfb-run python -m pytest --ds=config.settings

      - name: Teardown
        if: always()
        run: docker compose down
