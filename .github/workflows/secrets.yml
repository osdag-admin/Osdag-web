name: Secrets scan

on:
  pull_request:
    branches: [25april]
  push:
    branches: ["**"]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and needs no license key. The
      # gitleaks-action wrapper requires one for organisation repositories,
      # and secrets are unavailable to pull requests from forks, so the CLI
      # is used directly.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}$" checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Only commits added by this PR or push are scanned. The full history
      # is not scanned, because it still contains the old committed .env.
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            log_opts="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            log_opts="-1 ${PUSH_SHA}"
          fi
          gitleaks git --redact --verbose --exit-code 1 --log-opts="$log_opts" .
