# Pre-commit hooks. Install once with:
#   pip install pre-commit && pre-commit install
# Run on everything with:
#   pre-commit run --all-files
#
# Hook versions are pinned. Update them with `pre-commit autoupdate`, and keep
# the ruff version in sync with CONTRIBUTING.md and .github/workflows/ci.yml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # Blocks commits only on rules that catch real bugs (syntax errors,
      # undefined names), which the backend already passes. The full rule set
      # in pyproject.toml still has old findings in most files; switch to it
      # (drop args) after the one-time cleanup. Does not rewrite files.
      - id: ruff-check
        files: ^backend/
        args: [--select, "E9,F63,F7,F82"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
